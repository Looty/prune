[package]
name = "prune-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23.1"
rayon = "1.12.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
zip = { version = "9.1.2", default-features = false }
